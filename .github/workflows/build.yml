name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q Slad-android.zip
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare
        working-directory: slad-app
        run: |
          npm install
          npx expo install --fix || true
          npx expo install babel-preset-expo
          rm -f babel.config.js
          node scripts/build-html.js
          npx expo prebuild --platform android --clean --no-install
      - name: Build
        working-directory: slad-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon || (echo "Ponawiam za 60 s..." && sleep 60 && ./gradlew assembleRelease --no-daemon)
      - uses: actions/upload-artifact@v4
        with:
          name: slad-apk
          path: slad-app/android/app/build/outputs/apk/release/app-release.apk
